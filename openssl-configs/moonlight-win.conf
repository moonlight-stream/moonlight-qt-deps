my %targets = (
    "moonlight-win-common" => {
        template        => 1,
        # We need to use /FS to avoid PDB writing races with jom
        # Enable CFG and EHCont
        cflags          => add("/FS /guard:cf /guard:ehcont"),
        lflags          => add("/guard:cf /guard:ehcont"),
        # Disable incremental linking and strip unreferenced functions in DLLs.
        # Avoiding @ILT thunks is required for CFG with unpatched OpenSSL assembly.
        shared_ldflag   => add("/OPT:REF"),
    },
    "moonlight-win-x64" => {
        inherit_from    => [ "VC-WIN64A-masm", "moonlight-win-common" ],
        multilib        => "-x64",
        asflags         => add("/guard:ehcont"),
        lflags          => add("/CETCOMPAT"),
    },
    "moonlight-win-arm64" => {
        inherit_from    => [ "VC-WIN64-CLANGASM-ARM", "moonlight-win-common" ],
        cflags          => add("/guard:signret"),
    },
);
